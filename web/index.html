<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SmashDeck: Zero-budget college badminton club management, dynamic 3D Trump Cards, anti-proxy QR attendance, live BWF court umpire scoring, and Elo ladder challenges.">
  <meta name="theme-color" content="#0A122A">
  <style>
    html, body { margin: 0; background: #0a122a; color: #dbe1ff; }
    #boot { position: fixed; inset: 0; display: grid; place-content: center; gap: 18px; text-align: center; font: 700 14px system-ui, sans-serif; letter-spacing: 3px; }
    #boot span { width: 30px; height: 30px; margin: auto; border: 2px solid #2a3550; border-top-color: #c3f400; border-radius: 50%; animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #boot span { animation: none; } }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmashDeck">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SmashDeck • College Badminton Squad & Trump Card Engine</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="boot" role="status" aria-label="Loading SmashDeck"><span></span>SMASHDECK</div>
  <script>window.addEventListener('flutter-first-frame', function () { document.getElementById('boot')?.remove(); });</script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
