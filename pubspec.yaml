name: smashdeck
description: "Zero-Budget College Badminton Squad & Trump Card Club Management App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1

  # Backend, Auth & Realtime
  supabase_flutter: ^2.8.3

  # UI, Charts & Aesthetics
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # QR Code Attendance Engine (Issue-003 TOTP & Scan)
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.4

  # Utilities & Networking
  intl: ^0.20.2
  shared_preferences: ^2.3.5
  http: ^1.3.0
  uuid: ^4.5.1
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.4.0
  share_plus: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/images/avatars/
    - assets/web/
    - assets/web/assets/
